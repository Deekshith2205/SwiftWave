[workspace]
resolver = "2"

members = [
    "core/swiftwave_core",
    "packages/swiftwave_ffi",
]

# ---------------------------------------------------------------------------
# Workspace-level dependency versions (shared across all crates)
# Pin versions here; members reference them with { workspace = true }
# ---------------------------------------------------------------------------
[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-util", "fs", "sync", "time", "macros"] }

# Error handling
thiserror = "2"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Unique identifiers
uuid = { version = "1", features = ["v4", "serde"] }

# Async traits
async-trait = "0.1"

# ---------------------------------------------------------------------------
# Future deps — uncomment when implementing the corresponding module
# ---------------------------------------------------------------------------
quinn        = { version = "0.11", features = ["runtime-tokio", "rustls"] }  # QUIC transport
blake3       = "1"        # BLAKE3 hashing
snow         = "0.9"      # Noise protocol
chacha20poly1305 = "0.10" # AEAD cipher
x25519-dalek = { version = "2", features = ["static_secrets"] }  # X25519 ECDH
# zstd         = "0.13"     # Compression     (TODO: Phase 3)
bytes        = "1"        # Zero-copy bufs
rand_core    = { version = "0.6", features = ["getrandom"] }  # Randomness
bs58         = "0.5"      # Base58 encoding
rcgen        = "0.13"     # Self-signed TLS certs for QUIC layer
rustls       = { version = "0.23", features = ["ring"] }  # TLS for QUIC

[profile.release]
opt-level = 3
lto = "thin"       # Link-time optimisation — smaller binary, lower RAM
codegen-units = 1  # Single codegen unit for best optimisation
strip = true       # Strip debug symbols from release builds
panic = "abort"    # Removes unwinding machinery (~10 % size reduction)

[profile.dev]
opt-level = 0
debug = true

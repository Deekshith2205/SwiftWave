[workspace]
resolver = "2"

members = [
    "core/swiftwave_core",
    "packages/swiftwave_ffi",
]

# ---------------------------------------------------------------------------
# Workspace-level dependency versions (shared across all crates)
# Pin versions here; members reference them with { workspace = true }
# ---------------------------------------------------------------------------
[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-util", "fs", "sync", "time", "macros"] }

# Error handling
thiserror = "2"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Unique identifiers
uuid = { version = "1", features = ["v4", "serde"] }

# Async traits
async-trait = "0.1"

# ---------------------------------------------------------------------------
# Future deps — uncomment when implementing the corresponding module
# ---------------------------------------------------------------------------
# quinn        = "0.11"     # QUIC transport (TODO: Phase 2)
# blake3       = "1"        # BLAKE3 hashing  (TODO: Phase 2)
# snow         = "0.9"      # Noise protocol  (TODO: Phase 2)
# chacha20poly1305 = "0.10" # AEAD cipher     (TODO: Phase 2)
# x25519-dalek = "2"        # X25519 ECDH     (TODO: Phase 2)
# zstd         = "0.13"     # Compression     (TODO: Phase 3)
# bytes        = "1"        # Zero-copy bufs  (TODO: Phase 2)

[profile.release]
opt-level = 3
lto = "thin"       # Link-time optimisation — smaller binary, lower RAM
codegen-units = 1  # Single codegen unit for best optimisation
strip = true       # Strip debug symbols from release builds
panic = "abort"    # Removes unwinding machinery (~10 % size reduction)

[profile.dev]
opt-level = 0
debug = true

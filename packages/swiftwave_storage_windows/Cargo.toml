[package]
name = "swiftwave_storage_windows"
version = "0.1.0"
edition = "2021"
authors = ["SwiftWave Team"]
description = "Windows DPAPI implementation of SecureStorage for SwiftWave"

[dependencies]
swiftwave_core = { path = "../../core/swiftwave_core" }
windows-sys = { version = "0.52", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    "Win32_System_Memory"
] }

[dev-dependencies]
tempfile = "3.10"

[package]
name = "swiftwave_core"
version = "0.1.0"
edition = "2021"
description = "SwiftWave core library — transport-agnostic P2P file transfer engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/swiftwave"
keywords = ["p2p", "file-transfer", "offline", "privacy"]
categories = ["network-programming", "cryptography"]

[lib]
name = "swiftwave_core"
crate-type = ["lib"]

[dependencies]
tokio       = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
uuid        = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
